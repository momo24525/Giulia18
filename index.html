<!DOCTYPE html>
<html class="staticrypt-html">

<head>
    <meta charset="utf-8" />
    <title>AUGURI GIULIA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />

    <style>
        /* ===== Base ===== */
        * {
            box-sizing: border-box;
        }

        html.staticrypt-html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body.staticrypt-body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            background-color: #7b1b38;
            color: #F8D7DA;
        }

        /* ===== StatiCrypt ===== */
        .staticrypt-hr {
            margin: 20px 0;
            border: 0;
            border-top: 1px solid #eee;
        }

        .staticrypt-content {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .staticrypt-page {
            width: 75%;
            max-width: 45rem;
            margin: 2rem auto 0;
            padding: 0;
        }

        .staticrypt-form {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 0;
            text-align: center;
            background: transparent;
            box-shadow: none;
        }

        /* ===== Titolo della copertina ===== */
        .pw-text {
            width: 100%;
            margin: 2rem auto 0;
            padding: 0 12px;
            text-align: center;
            font-family: cursive;
            font-size: clamp(2.5rem, 9vw, 8rem);
            line-height: 1.15;
            font-weight: normal;
            color: #F8D7DA;
            overflow-wrap: break-word;
        }

        .emoji {
            display: inline-block;
            font-size: clamp(3rem, 10vw, 8rem);
            vertical-align: middle;
            position: relative;
            right: 92px;
            transform: rotate(348deg);
            margin-right: -88px;
        }

        /* ===== Form password ===== */
        .form-pw {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 12px;
            width: 100%;
            margin: 0 auto;
            padding: 0;
        }

        .form-pw label[for="staticrypt-password"] {
            width: 100%;
            margin: 0;
            color: #F8D7DA;
            font-family: cursive;
            font-size: clamp(1.4rem, 3vw, 2rem);
            text-align: left;
        }

        .staticrypt-password-container {
            position: relative;
            width: 100%;
            margin: 0;
            background: #fff8f5;
            border: 2px solid #F8D7DA;
            border-radius: 16px;
            overflow: hidden;
        }

        .staticrypt-password-container input[type="password"],
        .staticrypt-password-container input[type="text"] {
            display: block;
            width: 100%;
            min-width: 0;
            padding: 12px 48px 12px 16px;
            border: 0;
            border-radius: 0;
            outline: none;
            background: transparent;
            color: #800020;
            font-family: Arial, sans-serif;
            font-size: 1.1rem;
            line-height: 1.5;
            box-shadow: none;
        }

        .staticrypt-password-container input:focus {
            box-shadow: inset 0 0 0 1px #F8D7DA;
        }

        .staticrypt-toggle-password-visibility {
            position: absolute;
            top: 50%;
            right: 8px;
            width: 24px;
            height: 24px;
            padding: 2px;
            transform: translateY(-50%);
            opacity: 0.6;
            cursor: pointer;
        }

        .staticrypt-form .staticrypt-decrypt-button {
            width: 100%;
            margin: 0;
            padding: 12px 16px;
            border: 1px solid;
            border-radius: 12px;
            background: #800020;
            color: #ffffff;
            font-size: 1rem;
            font-family: Arial, sans-serif;
            cursor: pointer;
        }

        .staticrypt-form .staticrypt-decrypt-button:hover,
        .staticrypt-form .staticrypt-decrypt-button:focus {
            filter: brightness(1.15);
        }

        label.staticrypt-remember {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            width: 100%;
            margin: 4px 0;
            color: #F8D7DA;
            font-family: Arial, sans-serif;
            font-size: 0.9rem;
            text-align: left;
        }

        .staticrypt-remember input[type="checkbox"] {
            width: auto;
            margin: 0;
            transform: scale(1.15);
        }

        .staticrypt-title {
            font-size: 1.5rem;
        }

        .staticrypt-instructions {
            margin: 0 0 1rem;
        }

        .hidden {
            display: none !important;
        }

        .staticrypt-spinner-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #7b1b38;
        }

        .staticrypt-spinner {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            border: 0.25rem solid #F8D7DA;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spinner-border 0.75s linear infinite;
        }

        @keyframes spinner-border {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 600px) {
            .pw-text {
                margin-top: 1.5rem;
                font-size: clamp(5.3rem, 9vw, 3.5rem);
            }

            .emoji {
                font-size: clamp(2.5rem, 11vw, 4rem);
            }

            .staticrypt-page {
                width: 88%;
                margin-top: 1.5rem;
            }
        }
    </style>
</head>
